<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Canvast — the loop harness for AI coding agents</title>
  <desc id="desc">Canvast hero: self-built open-source loop harness wordmark beside the governance canvas provenance chain — Decision motivates Plan, Plan is executed by an AgentRun, AgentRun produces a File.</desc>
  <defs>
    <style>
      .bg { fill: #070b13; }
      .eyebrow { fill: #1fc4f4; font-family: "SF Mono", "Menlo", monospace; font-size: 19px; font-weight: 600; letter-spacing: 3px; }
      .name { fill: #eaf6ff; font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif; font-size: 100px; font-weight: 800; letter-spacing: 8px; }
      .tag-en { fill: #a9dcf3; font-family: "SF Pro Text", "Helvetica Neue", Arial, sans-serif; font-size: 27px; font-weight: 500; }
      .tag-zh { fill: #7192ab; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 400; letter-spacing: 2px; }
      .chip { fill: #0a1622; stroke-width: 2; }
      .chip-text { font-family: "SF Mono", "Menlo", monospace; font-size: 20px; }
      .panel { fill: #0a141f; stroke: #1fc4f4; stroke-width: 4; }
      .edge { fill: none; stroke: #1c577a; stroke-width: 3; }
      .node-label { fill: #b8d8ea; font-family: "SF Mono", "Menlo", monospace; font-size: 17px; text-anchor: middle; }
      .legend { fill: #7192ab; font-family: "SF Mono", "Menlo", monospace; font-size: 16px; }
      .n-file { fill: #07111b; stroke: #1fc4f4; stroke-width: 5; }
      .n-plan { fill: #07111b; stroke: #47d86b; stroke-width: 5; }
      .n-decision { fill: #07111b; stroke: #ffbd36; stroke-width: 5; }
      .n-agent { fill: #07111b; stroke: #8b7cf6; stroke-width: 5; }
      .dot-file { fill: #23c9f7; }
      .dot-plan { fill: #45d869; }
      .dot-decision { fill: #ffbd36; }
      .dot-agent { fill: #8b7cf6; }
      .divider { stroke: #14324a; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L5 10L10 0z" fill="#1c577a"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="640"/>

  <!-- left zone: identity -->
  <text class="eyebrow" x="84" y="150">SELF-BUILT · OPEN SOURCE · LOOP HARNESS</text>
  <text class="name" x="80" y="272">CANVAST</text>
  <rect x="86" y="302" width="300" height="6" fill="#1fc4f4"/>
  <rect x="394" y="302" width="56" height="6" fill="#47d86b"/>
  <rect x="458" y="302" width="22" height="6" fill="#ffbd36"/>

  <text class="tag-en" x="84" y="372">The loop harness for AI coding agents —</text>
  <text class="tag-en" x="84" y="412">every turn grounded in the whole project.</text>
  <text class="tag-zh" x="84" y="470">自研开源 Loop 架构，为大型项目而生的项目治理画布</text>

  <g>
    <rect class="chip" x="82" y="520" width="196" height="46" rx="9" stroke="#1fc4f4"/>
    <text class="chip-text" x="106" y="550" fill="#9fd9f2">Graph Canvas</text>
  </g>
  <g>
    <rect class="chip" x="294" y="520" width="230" height="46" rx="9" stroke="#47d86b"/>
    <text class="chip-text" x="318" y="550" fill="#9ce8b2">Loop Governance</text>
  </g>
  <g>
    <rect class="chip" x="540" y="520" width="220" height="46" rx="9" stroke="#ffbd36"/>
    <text class="chip-text" x="564" y="550" fill="#f2cf8a">TUI + macOS App</text>
  </g>

  <path class="divider" d="M788 120V520"/>

  <!-- right zone: governance canvas — provenance chain as a Z-flow -->
  <rect class="panel" x="828" y="120" width="392" height="400" rx="18"/>

  <!-- typed edges: Decision → Plan → AgentRun → File -->
  <path class="edge" d="M972 200H1078" marker-end="url(#arrow)"/>
  <path class="edge" d="M1110 232V378" marker-end="url(#arrow)"/>
  <path class="edge" d="M1078 410H972" marker-end="url(#arrow)"/>

  <!-- Decision (why) — top-left -->
  <circle class="n-decision" cx="940" cy="200" r="26"/>
  <circle class="dot-decision" cx="940" cy="200" r="9"/>
  <text class="node-label" x="940" y="156" text-anchor="middle">Decision</text>

  <!-- Plan (what) — top-right -->
  <circle class="n-plan" cx="1110" cy="200" r="26"/>
  <circle class="dot-plan" cx="1110" cy="200" r="9"/>
  <text class="node-label" x="1110" y="156" text-anchor="middle">Plan</text>

  <!-- AgentRun (who) — bottom-right -->
  <circle class="n-agent" cx="1110" cy="410" r="26"/>
  <circle class="dot-agent" cx="1110" cy="410" r="9"/>
  <text class="node-label" x="1110" y="462" text-anchor="middle">AgentRun</text>

  <!-- File (result) — bottom-left -->
  <circle class="n-file" cx="940" cy="410" r="26"/>
  <circle class="dot-file" cx="940" cy="410" r="9"/>
  <text class="node-label" x="940" y="462" text-anchor="middle">File</text>

  <text class="legend" x="1024" y="508" text-anchor="middle">typed nodes · typed links · persistent</text>
</svg>
